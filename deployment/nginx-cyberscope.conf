limit_req_zone $binary_remote_addr zone=cyberscope:10m rate=10r/s;
server { listen 80; server_name example.org; client_max_body_size 1m;
 location / { limit_req zone=cyberscope burst=20 nodelay; proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}
